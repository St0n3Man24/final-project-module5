<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://kit.fontawesome.com/d831fbd0b2.js" crossorigin="anonymous"></script>
  <script src="index.js"></script>
  <link rel="stylesheet" href="styles.css">
  <title>Document</title>
</head>
<body>
  <section id="landing">
    <nav>
      <div class="nav__container">
        <img class="logo" src="./assets/movie_logo.jpg" alt="">
        <ul class="nav__links">
          <li class="nav__link">
            <a href="#" class="nav__link--anchor link__hover-effect">Home</a></li>
          <li class="nav__link">
            <a href="#" class="nav__link--anchor link__hover-effect">About</a></li>
        </ul>
      </div>
    </nav>
    <header>
      <div class="header__container">
        <div class="header__description">
          <h2>Browse For Your Favorite <span class="blue">Movies</span></h2>
        </div>
        <div class="header__search">
          <input type="text" class="header__search--input" placeholder="Search by Keyword">
          <button class="header__search--btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
      </div>
    </header>
  </section>

</html>
